    <path d="M12 20c-1 4-3 7-5 8 1 0 2 1 3 1 1 0 2-1 3-1-1-2-1-5-1-8z" fill="#e14b3a"/>
    <path d="M18 20c1 4 3 7 5 8-1 0-2 1-3 1-1 0-2-1-3-1 1-2 1-5 1-8z" fill="#a03fa8"/>
    <path d="M14 12c0-1-1-3-2-4 3 0 5 2 5 4-1 1-2 1-3 0z" fill="#2b7fd0"/>
