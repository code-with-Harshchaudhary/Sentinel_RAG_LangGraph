<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8cfb7"/>
      <stop offset="1" stop-color="#a89f86"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <rect x="18" y="10" width="164" height="230" rx="14" fill="url(#case)" stroke="#5b543f" stroke-width="1.5"/>
