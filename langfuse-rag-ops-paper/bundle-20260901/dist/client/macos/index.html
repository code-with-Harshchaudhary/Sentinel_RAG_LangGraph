<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050506" />
    <link rel="preload" as="image" href="/assets/apple-loader.png" fetchpriority="high" />
    <title>Harsh — macOS Portfolio</title>
    <style>
      :root {
        color-scheme: dark;
        --bezel-top: 19.6px;
        --bezel-side: var(--bezel-top);
        --bezel-bottom: var(--bezel-top);
        --shell-radius: 24px;
        --screen-radius: 15px;
        --notch-width: clamp(180px, 15vw, 220px);
        --notch-drop: 34px;
        --system-ease: cubic-bezier(.22, 1, .36, 1);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background:
          radial-gradient(90% 42% at 50% 0%, rgba(55, 57, 62, .17), transparent 58%),
          #050506;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      }

      /* Exact visual language of the main-page Apple entry loader. */
      .macos-entry-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #050506;
        opacity: 1;
        visibility: visible;
        transition: opacity 250ms cubic-bezier(.25, 1, .5, 1), visibility 0s linear 250ms;
      }
      .macos-entry-loader.is-complete {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .macos-entry-progress {
        position: relative;
        width: 140px;
        height: 6px;
        overflow: visible;
        border-radius: 999px;
        background: rgba(230, 232, 232, .32);
      }
      .macos-entry-progress::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: calc(50% + 18px);
        width: clamp(64.8px, 8.4vw, 81.6px);
        aspect-ratio: 544 / 670;
        pointer-events: none;
        opacity: 0;
        translate: -50% 0;
        scale: .97;
        transform: translateY(1px);
        transform-origin: 50% 100%;
        background: url("/assets/apple-loader.png") 49.35% 44.5% / 278.77% auto no-repeat;
        filter: drop-shadow(0 8px 18px rgba(12, 18, 30, .22));
        animation: entry-loader-logo-arrive 900ms cubic-bezier(.22, 1, .36, 1) 40ms forwards,
                   entry-loader-logo-float 2400ms ease-in-out 650ms infinite alternate;
        will-change: opacity, scale, transform;
        contain: layout paint;
      }
      .macos-entry-fill {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: rgba(255, 255, 255, .96);
        transition: width 520ms cubic-bezier(.22, 1, .36, 1);
        will-change: width;
      }
      @keyframes entry-loader-logo-arrive { from { opacity: 0; scale: .97; } to { opacity: 1; scale: 1; } }
      @keyframes entry-loader-logo-float { from { transform: translateY(1px); } to { transform: translateY(-1px); } }
      @keyframes entry-loader-logo-reduced { from { opacity: 0; } to { opacity: 1; } }

      .product-stage {
        width: 100%;
        height: 100dvh;
        padding: 0;
      }

      .macbook-display {
        position: relative;
        width: 100%;
        height: 100%;
        padding: var(--bezel-top) var(--bezel-side) var(--bezel-bottom);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 34px 34px var(--shell-radius) var(--shell-radius);
        background:
          linear-gradient(110deg, rgba(255,255,255,.045), transparent 13% 86%, rgba(255,255,255,.025)),
          #050506;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .13),
          inset 0 -1px 0 rgba(255, 255, 255, .05);
        transform: translateZ(0);
        transition: box-shadow 420ms var(--system-ease);
      }

      .macbook-display.is-unlocked {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .15),
          inset 0 -1px 0 rgba(255, 255, 255, .05);
      }

      .display-glass {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 26px 26px var(--screen-radius) var(--screen-radius);
        background: #0a0e14;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, .94),
          inset 0 0 26px rgba(0, 0, 0, .2);
        isolation: isolate;
      }

      .macos-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #0a0e14;
        transform: scale(.998);
        transform-origin: 50% 50%;
        transition: transform 640ms var(--system-ease);
      }
      .macbook-display.is-unlocked .macos-frame { transform: scale(1); }

      .camera-housing {
        position: absolute;
        z-index: 2;
        top: 1px;
        left: 50%;
        width: var(--notch-width);
        height: calc(var(--bezel-top) + var(--notch-drop) - 1px);
        transform: translateX(-50%);
        border-radius: 0 0 13px 13px;
        background: #050506;
        box-shadow: 0 1px 0 rgba(255,255,255,.025);
        pointer-events: none;
      }

      .camera-optics {
        position: absolute;
        left: 50%;
        top: calc(var(--bezel-top) + 5px);
        display: flex;
        align-items: center;
        gap: 12px;
        transform: translateX(-50%);
      }
      .camera-lens {
        width: 8px;
        height: 8px;
        border: 1px solid rgba(93, 117, 144, .28);
        border-radius: 50%;
        background:
          radial-gradient(circle at 38% 34%, rgba(99, 136, 176, .5) 0 8%, transparent 22%),
          radial-gradient(circle, #07111d 0 36%, #020306 62%, #000 100%);
        box-shadow: 0 0 0 2px rgba(0,0,0,.74), inset 0 0 3px rgba(67,105,151,.24);
      }
      .camera-status {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #35e96e;
        opacity: .18;
        box-shadow: 0 0 0 rgba(53,233,110,0);
        transition: opacity 420ms ease 120ms, box-shadow 420ms ease 120ms;
      }
      .macbook-display.is-unlocked .camera-status {
        opacity: .95;
        box-shadow: 0 0 7px rgba(53,233,110,.76);
      }

      @media (max-width: 900px) {
        :root {
          --bezel-top: 18.2px;
          --shell-radius: 21px;
          --screen-radius: 14px;
          --notch-width: 142px;
          --notch-drop: 30px;
        }
      }

      @media (max-width: 640px) {
        :root {
          --bezel-top: 16.8px;
          --shell-radius: 18px;
          --screen-radius: 12px;
          --notch-width: 112px;
          --notch-drop: 27px;
        }
        .macbook-display { border-radius: 25px 25px var(--shell-radius) var(--shell-radius); }
        .display-glass { border-radius: 21px 21px var(--screen-radius) var(--screen-radius); }
        .camera-housing { border-radius: 0 0 10px 10px; }
        .camera-optics { top: calc(var(--bezel-top) + 3px); gap: 8px; }
        .camera-lens { width: 6px; height: 6px; }
        .camera-status { width: 4px; height: 4px; }
        .macos-entry-progress::before { bottom: calc(50% + 16px); width: 64.8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .macos-entry-loader { transition-duration: .01ms; }
        .macos-entry-fill { transition-duration: .01ms; }
        .macos-entry-progress::before {
          scale: 1;
          transform: none;
          animation: entry-loader-logo-reduced 200ms ease-out forwards;
        }
      }

      .macbook-display.motion-reduced,
      .macbook-display.motion-reduced .macos-frame,
      .macbook-display.motion-reduced .camera-status { transition-duration: .01ms !important; }
    </style>
  </head>
  <body>
    <div class="macos-entry-loader" role="status" aria-label="Loading macOS portfolio">
      <div class="macos-entry-progress" aria-hidden="true">
        <span class="macos-entry-fill"></span>
      </div>
    </div>
    <main class="product-stage">
      <section class="macbook-display" aria-label="MacBook display">
        <div class="camera-housing" aria-hidden="true">
          <div class="camera-optics">
            <span class="camera-lens"></span>
            <span class="camera-status"></span>
          </div>
        </div>
        <div class="display-glass">
          <iframe
            class="macos-frame"
            src="/macos/desktop.html?v=4"
            title="Harsh's macOS desktop portfolio"
            sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-top-navigation allow-top-navigation-by-user-activation"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          ></iframe>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const shell = document.querySelector('.macbook-display');
        const frame = document.querySelector('.macos-frame');
        const entryLoader = document.querySelector('.macos-entry-loader');
        const entryFill = document.querySelector('.macos-entry-fill');
        if (!shell || !frame) return;

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const loaderStartedAt = performance.now();
        let loaderFinished = false;
        const setLoaderProgress = (value) => {
          if (entryFill) entryFill.style.width = `${value}%`;
        };
        const finishEntryLoader = () => {
          if (loaderFinished) return;
          loaderFinished = true;
          const minimumVisible = reducedMotion ? 120 : 950;
          const remaining = Math.max(0, minimumVisible - (performance.now() - loaderStartedAt));
          window.setTimeout(() => {
            setLoaderProgress(100);
            window.setTimeout(() => entryLoader?.classList.add('is-complete'), reducedMotion ? 20 : 540);
          }, remaining);
        };

        requestAnimationFrame(() => setLoaderProgress(18));
        window.setTimeout(() => setLoaderProgress(52), 180);
        window.setTimeout(() => setLoaderProgress(78), 560);

        const setDesktopState = (state) => {
          shell.classList.toggle('is-unlocked', state === 'unlocked');
        };
        const setMotionState = (reduced) => {
          shell.classList.toggle('motion-reduced', reduced === true);
        };

        window.addEventListener('message', (event) => {
          if (event.data?.type === 'macos-desktop-state') setDesktopState(event.data.state);
          if (event.data?.type === 'macos-motion-state') setMotionState(event.data.reduced);
        });

        const requestDesktopState = () => {
          frame.contentWindow?.postMessage({ type: 'macos-shell-ready' }, '*');
        };
        frame.addEventListener('load', () => {
          requestDesktopState();
          finishEntryLoader();
        });
        window.setTimeout(finishEntryLoader, 6000);
      })();
    </script>
  </body>
</html>
