name: Sentinel RAG Ops CI

on:
  push:
    branches: [main]
    paths:
      - "lightrag/**"
      - "lightrag_webui/**"
      - "tests/**"
      - "deploy/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - "README.md"
  pull_request:
    paths:
      - "lightrag/**"
      - "lightrag_webui/**"
      - "tests/**"
      - "deploy/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lightrag_webui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra api --extra postgres --extra pytest
      - run: uv run ruff check lightrag tests
      - name: Run Gemini/PostgreSQL backend offline tests
        run: >-
          uv run --no-sync pytest
          tests/api tests/llm/gemini_impl tests/kg/postgres_impl tests/workspace
          -m offline --tb=short
          --ignore=tests/api/config/test_api_config_lollms_host.py
          --ignore=tests/api/config/test_embedding_dimension_guard.py
          --ignore=tests/api/config/test_ollama_embedding_dimension.py
          --ignore=tests/api/config/test_ollama_think_startup_validation.py
